<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <form class="row" id="connect-form">
        <input id="ip-input" placeholder="IP (ej. 127.0.0.1)" required autocomplete="off" />
        <input id="port-input" type="number" min="1" max="65535" placeholder="Puerto" required />
        <button type="submit">Conectar</button>
      </form>
      <p id="status"></p>

      <div class="chat">
        <ul id="received"></ul>
        <ul id="sent"></ul>
      </div>

      <form class="row" id="message-form">
        <input id="message-input" placeholder="Escribe un mensaje..." autocomplete="off" />
        <button type="submit">Enviar</button>
      </form>
    </main>
  </body>
</html>
